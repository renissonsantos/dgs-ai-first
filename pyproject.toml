[project]
name = "novatech-prompt-engineering"
version = "0.1.0"
description = "Estratégia de prompt e context engineering como artefato de arquitetura versionado para o assistente NovaTech"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "azure-search-documents>=11.4.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Azure services)",
]
pythonpath = ["."]
